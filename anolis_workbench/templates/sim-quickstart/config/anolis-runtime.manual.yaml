runtime:
  name: anolis-main
  shutdown_timeout_ms: 2000
  startup_timeout_ms: 30000
http:
  enabled: true
  bind: 127.0.0.1
  port: 8080
  cors_allow_credentials: false
  cors_allowed_origins:
  - http://localhost:3000
  - http://127.0.0.1:3000
providers:
- id: sim0
  command: ../anolis-provider-sim/build/dev-release/anolis-provider-sim
  args:
  - --config
  - ../anolis-projects/projects/sim-quickstart/config/provider-sim.sim0.yaml
  timeout_ms: 5000
  hello_timeout_ms: 2000
  ready_timeout_ms: 10000
  restart_policy:
    enabled: false
polling:
  interval_ms: 500
telemetry:
  enabled: false
logging:
  level: info
# What the software stop drives (POST /v0/estop): every sim output off.
# tempctl0 takes set_relay only in open mode, so the mode goes first.
safety:
  safe_state:
    hooks:
    - device_handle: sim0/motorctl0
      function_name: set_motor_duty
      args:
        motor_index: 1
        duty: 0.0
    - device_handle: sim0/motorctl0
      function_name: set_motor_duty
      args:
        motor_index: 2
        duty: 0.0
    - device_handle: sim0/tempctl0
      function_name: set_mode
      args:
        mode: open
    - device_handle: sim0/tempctl0
      function_name: set_relay
      args:
        relay_index: 1
        state: false
    - device_handle: sim0/tempctl0
      function_name: set_relay
      args:
        relay_index: 2
        state: false
    - device_handle: sim0/relayio0
      function_name: set_relay_ch1
      args:
        enabled: false
    - device_handle: sim0/relayio0
      function_name: set_relay_ch2
      args:
        enabled: false
    - device_handle: sim0/relayio0
      function_name: set_relay_ch3
      args:
        enabled: false
    - device_handle: sim0/relayio0
      function_name: set_relay_ch4
      args:
        enabled: false
automation:
  enabled: false
