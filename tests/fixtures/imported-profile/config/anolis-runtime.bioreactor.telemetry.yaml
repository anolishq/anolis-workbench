runtime:
  name: bioreactor-telemetry
  shutdown_timeout_ms: 3000
  startup_timeout_ms: 30000

http:
  enabled: true
  bind: 127.0.0.1
  port: 8080
  cors_allowed_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
  cors_allow_credentials: false

providers:
  - id: bread0
    command: ../anolis-provider-bread/build/dev-release/anolis-provider-bread
    args: ["--config", "../anolis-projects/projects/imported-profile/config/provider-bread.bioreactor.yaml"]
    timeout_ms: 5000
    hello_timeout_ms: 2000
    ready_timeout_ms: 10000
    restart_policy:
      enabled: true
      max_attempts: 3
      backoff_ms: [200, 500, 1000]
      timeout_ms: 30000

  - id: ezo0
    command: ../anolis-provider-ezo/build/dev-linux-hardware-release/anolis-provider-ezo
    args: ["--config", "../anolis-projects/projects/imported-profile/config/provider-ezo.bioreactor.yaml"]
    timeout_ms: 5000
    hello_timeout_ms: 5000
    ready_timeout_ms: 10000
    restart_policy:
      enabled: true
      max_attempts: 3
      backoff_ms: [200, 500, 1000]
      timeout_ms: 30000

polling:
  interval_ms: 2500

telemetry:
  enabled: true
  # Token via INFLUXDB_TOKEN env (/etc/anolis/runtime.env), not this file.
  influxdb:
    url: http://localhost:8086
    org: anolis
    bucket: anolis
    batch_size: 100
    flush_interval_ms: 1000

automation:
  enabled: false

logging:
  level: info
